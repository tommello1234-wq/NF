name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck and build
        run: npm run typecheck

      - name: Audit production deps
        # --audit-level=critical: bloqueia só vulnerabilidades critical.
        # Algumas deps importantes (ex: xlsx do SheetJS) têm avisos high
        # sem fix disponível no npm. Vulnerabilidades novas críticas
        # continuam falhando o build.
        run: npm audit --omit=dev --audit-level=critical
